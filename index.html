<!doctype html>
<html lang="en-GB">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-view="list">

      <path d="M11 28.5h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-bowl-outline" viewBox="0 0 32 32">
      <path d="M15 2.5 23.5 13.5M21 2l5.5 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M3.6 15h24.8c-.5 6-5.9 10.5-12.4 10.5S4.1 21 3.6 15Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M11 28.5h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>

    <symbol id="i-naruto" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14.5" fill="#FFFDF8" stroke="#F28CA6" stroke-width="2" stroke-dasharray="3 2.2"/>

  <a class="skip" href="#main">Skip to content</a>

  <div class="app">
    <header class="hdr">
      <div class="hdr-top">
        <span class="hdr-bowl" aria-hidden="true">
          <span class="steam"><i></i><i></i><i></i></span>
          <svg class="ico"><use href="#i-bowl"/></svg>
        </span>
        <h1><span class="hdr-small">Murray &amp; Liat’s</span> Ramen Quest</h1>
        <span id="sync-chip" class="sync-chip" role="status" hidden></span>
      </div>
      <div class="progress" role="progressbar" aria-label="Main quest progress" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0"><span></span></div>
      <div class="hdr-progress">
        <ul class="bowl-row" aria-hidden="true"></ul>
        <p class="progress-text"></p>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="v-list" class="view" aria-label="Restaurants"></section>
      <section id="v-map" class="view view-map" aria-label="Map" hidden></section>
      <section id="v-stats" class="view" aria-label="Stats" hidden></section>
      <section id="v-settings" class="view" aria-label="Settings" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <a href="#list" data-tab="list"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg><span>List</span></a>
      <a href="#map" data-tab="map"><svg class="ico" aria-hidden="true"><use href="#i-map"/></svg><span>Map</span></a>
      <a href="#stats" data-tab="stats"><svg class="ico" aria-hidden="true"><use href="#i-stats"/></svg><span>Stats</span></a>
      <a href="#settings" data-tab="settings" class="tab-icon-only" aria-label="Settings"><svg class="ico" aria-hidden="true"><use href="#i-gear"/></svg></a>
    </nav>
  </div>

  <div id="sheet-root" class="sheet-root"></div>
  <dialog id="whoami" class="dialog" aria-labelledby="whoami-title"></dialog>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript><p class="empty">Ramen Quest needs JavaScript to run. 🍜</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
